font_size        12
font_family      IBM Plex Mono
bold_font        IBM Plex Mono Bold
italic_font      IBM Plex Mono Italic
bold_italic_font IBM Plex Mono Bold Italic

cursor_shape underline
cursor_underline_thickness 1.5
cursor_blink_interval 0.8
cursor_trail 200
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
shell_integration no-cursor
default_pointer_shape arrow

select_by_word_characters ()[]{}<>/\:;^$!"',@+-=_
strip_trailing_spaces always

scrollback_lines 5000

detect_urls no
enable_audio_bell no

remember_window_size no
initial_window_width 1000
initial_window_height 600
window_padding_width 0
confirm_os_window_close 0

background_opacity 0.8
selection_foreground #242a2e
selection_background #d3c6aa
color0 #242a2e
color1 #f85552
color2 #8da101
color3 #dfa000
color4 #3a94c5
color5 #df69ba
color6 #35a77c
color7 #859289
color8 #2d353b
color9 #e67e80
color10 #a7c080
color11 #dbbc7f
color12 #7fbbbc
color13 #d699b6
color14 #83c092
color15 #9da9a0

tab_title_template " {index} "
tab_bar_style separator
tab_separator " "
active_tab_foreground #d3c6aa
active_tab_background #272e33
inactive_tab_foreground #d3c6aa
inactive_tab_background #272e33
foreground #d3c6aa
background #272e33

